<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css"/>
    <script src="main.js" defer></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
    <header class="border-b border-slate-200 bg-white">
    <div class="'mx-auto flex max-w-6xl items-center" gap-3 px-4 py-4">
        <div class=""flex h-10 w-10 items-center justify-center rounded-xl bg-emerald-600 text-white">
            <i data-lucide="wallet"></i>
        </div>
        <h1 class="text-lg font-semibold">Personal Finance Tracker</h1>
        </div>
    </header>
    <main class="mx-auto max-w-6xl px-4 py-8">
        <section class="grid gap-4 sm:grid-cols-3">
            <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
               <div class="flex items-center` justify-between">
                        <p class="text-sm font-medium text-slate-500">Total Balance</p>
                        <i data-lucide="circle" class="h-5 w-5 text-emerald-600"></i>
                        
                </div>
                <p id="balance-amount" class="mt-2 text-3xl font-bold">$1250.00</p>
            </article>

            <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <div class="flex items-center justify-between">
                    <p class="text-sm font-medium text-slate-500">Total Income</p>
                    <i data-lucide="trending-up" class="h-5 w-5 text-green-600"> </i> 
                   
                   
                    </div>
                     <p id="income-amount" class="mt-2 text-3xl font-bold text-emerald-600">$1240.00</p>
            </article>

            <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <div class="flex items-center justify-between">
                    <p class="text-sm font-medium text-slate-500">TotalExpenses</p>
                    <i data-lucide="trending-down" class="h-5 w-5 text-red-600"></i>
                   
           
                </div>
                 <p id="expense-amount" class="mt-2 text-3xl font-bold text-rose-600">$1000.00</p>
               
                </article>
        </section>


        <section class="mt-6 max-w-md rounded-2x1 border border-slate-200 bg-white p-5 shadow-sm">
            <h2 class="mb-4 text-base font-semibold"> Add transaction</h2>
            <form id="transaction-form" class ="space-y-4" novalidate>
                <div>
                    <label for="type" class="mb-1 block text-sm font-medium text-slate-700">Type</label>
                    <select id="type" name="type" class ="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm">
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>

                    </select>
                </div>

                <div>
                    <label for="description" class="mb-1 block text-sm font-medium text-slate-700">Description</label>
                    <input id="description" name="description" type="text" placeholder="e.g. Groceries"
                        class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"/>
                    <p id="description-error" class="'mt-1 text-xs text-rose-600"></p>


                </div>

                <div>
                    <label for="amount" class="mb-1 block text-sm font-medium text-slate-700">Amount</label>
                    <input id="amount" name="amount" type="number" step="0.01" placeholder="0.00"
                            class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"/>
                    <p id="amouint-error" class="mt-1 text-xs text-rose-600"></p>

                </div>

                <div>
                    <label for="category" class="mb-1 block text-sm font-medium text-slate-700">Category</label>
                    <select id="category" name="category" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm">
                            <option value="">Select a category</option>
                            <option value="Salary">Salary</option>
                            <option value="Freelance">Freelance</option>
                            <option value="Housing">Housing</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                    </select>
                    <p id="category-error" class="'mt-1 text-xs text-rose-600"></p>
                </div>

                    
                <div>
                    <label for="date" class="mb-1 block text-sm font-medium text-slate-700">Date</label>
                    <input id="date" name="date" type="date"
                        class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"/>
                    <p id="date-error" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <button type="submit"
                    class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">
                  Add transaction
                </button>
            </form>
        </section>
    </main>
    
</body>
</html>
