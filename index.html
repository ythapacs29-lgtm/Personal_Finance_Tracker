<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="'style.css"/>
    <script src="main.js" defer></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
    <header class="border-b border-slate-200 bg-white">
    <div class="'mx-auto flex max-w-6xl items-center" gap-3 px-4 py-4">
        <div class=""flex h-10 w-10 items-center justify-center rounded-xl bg-emerald-600 text-white">
            <i data-lucide="wallet"></i>
        </div>
        <h1 class="text-lg font-semibold">Personal Finance Tracker</h1>
        </div>
    </header>
    <main class="mx-auto max-w-6xl px-4 py-8">
        <section class="grid gap-4 sm:grid-cols-3">
            <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
               <div class="flex items-center` justify-between">
                        <p class="text-sm font-medium text-slate-500">Total Balance</p>
                        <i data-lucide="circle" class="h-5 w-5 text-emerald-600"></i>
                        
                </div>
                <p id="balance-amount" class="mt-2 text-3xl font-bold">$1250.00</p>
            </article>

            <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <div class="flex items-center justify-between">
                    <p class="text-sm font-medium text-slate-500">Total Income</p>
                    <i data-lucide="trending-up" class="h-5 w-5 text-green-600"> </i> 
                   
                   
                    </div>
                     <p id="income-amount" class="mt-2 text-3xl font-bold text-emerald-600">$1240.00</p>
            </article>

            <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <div class="flex items-center justify-between">
                    <p class="text-sm font-medium text-slate-500">TotalExpenses</p>
                    <i data-lucide="trending-down" class="h-5 w-5 text-red-600"></i>
                   
           
                </div>
                 <p id="expense-amount" class="mt-2 text-3xl font-bold text-rose-600">$1000.00</p>
               
                </article>
        </section>

    </main>
    
</body>
</html>
